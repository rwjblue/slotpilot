[workspace]
members = [
    "apps/cli",
    "apps/daemon",
    "crates/api",
    "crates/domain",
    "crates/ipc",
    "crates/operations",
    "crates/protocol",
    "crates/storage",
    "crates/testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0-dev.0"
repository = "https://github.com/rwjblue/slotpilot"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
fs2 = "0.4.3"
interprocess = "2.4.2"
nix = { version = "0.31.3", features = ["user"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
slotpilot-api = { path = "crates/api" }
slotpilot-domain = { path = "crates/domain" }
slotpilot-ipc = { path = "crates/ipc" }
slotpilot-operations = { path = "crates/operations" }
slotpilot-protocol = { path = "crates/protocol" }
slotpilot-storage = { path = "crates/storage" }
slotpilot-testkit = { path = "crates/testkit" }
thiserror = "2.0.19"
widestring = "1.2.1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
