name: Design proposal
description: Propose a durable product or architecture decision
title: "Design: "
labels: ["kind: design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What durable problem or ambiguity needs a decision?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and invariants
      description: Include attended-operation, safety, cross-platform, API, and licensing constraints where relevant.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences and migration
    validations:
      required: true
