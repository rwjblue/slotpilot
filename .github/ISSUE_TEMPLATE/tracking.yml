name: Tracking issue
description: Map a milestone or multi-issue outcome without authorizing implementation
title: "Tracking: "
labels: ["tracking"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the recognizable outcome this tracker coordinates.
    validations:
      required: true
  - type: textarea
    id: foundation
    attributes:
      label: Existing foundation
      placeholder: |
        - [ ] Completed or already available foundation
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: Focused issues
      placeholder: |
        - [ ] Focused decision or implementation issue
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependency order
      description: Describe the critical path and work that may proceed independently.
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria
      placeholder: |
        - [ ] Every focused child has landed with completion evidence.
        - [ ] The complete outcome is verified at the appropriate boundary.
        - [ ] Maintained documentation agrees with shipped behavior.
        - [ ] Deliberately deferred behavior is explicit.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Out of scope
      description: Adjacent tracks and product behavior not owned here.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        This tracker is not directly executable and must not receive
        `agent-ready`. New implementation belongs in focused issues with
        bounded contracts.
