name: Bug report
description: Report incorrect or unsafe behavior
title: "Bug: "
labels: ["kind: bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include whether fake, loopback, dummy-load, or live hardware was involved. Do not transmit merely to reproduce a bug.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, SlotPilot revision, rig/audio profile, Hamlib version, and relevant hardware.
  - type: dropdown
    id: safety
    attributes:
      label: Safety impact
      options:
        - None known
        - Transmit or PTT behavior
        - Frequency, mode, or power behavior
        - Operator authority or recovery
        - Logging or duplicate-policy integrity
        - Credential or local-control exposure
        - Other
    validations:
      required: true
